name: Update Sports RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create RSS feed
        run: |
          cat > sports.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
            <channel>
              <title>Live and Upcoming Sports</title>
              <description>Live and upcoming sports events</description>
              <link>https://flkracker03-tech.github.io/Sports-rss/</link>
              <item>
                <title>Sports RSS Feed</title>
                <description>Feed is active and ready for live and upcoming events.</description>
              </item>
            </channel>
          </rss>
          EOF

      - name: Commit RSS feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports.xml
          git diff --cached --quiet || git commit -m "Update sports RSS feed"
          git push
