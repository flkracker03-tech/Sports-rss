name: Update Sports RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sports RSS
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from xml.sax.saxutils import escape

          leagues = [
              ("NFL", "football", "nfl"),
              ("College Football", "football", "college-football"),
              ("NBA", "basketball", "nba"),
              ("College Basketball", "basketball", "mens-college-basketball"),
              ("WNBA", "basketball", "wnba"),
              ("MLB", "baseball", "mlb"),
              ("NHL", "hockey", "nhl"),
              ("MLS", "soccer", "usa.1"),
          ]

          events = {}

          for days_ahead in range(8):
              day = (
                  datetime.now(timezone.utc)
                  + timedelta(days=days_ahead)
              ).strftime("%Y%m%d")

              for sport_name, sport, league in leagues:
                  url = (
                      f"https://site.api.espn.com/apis/site/v2/sports/"
                      f"{sport}/{league}/scoreboard?dates={day}"
                  )

                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          data = json.load(response)

                      for event in data.get("events", []):
                          event_id = str(event.get("id", ""))

                          if event_id:
                              event["_sport"] = sport_name
                              events[event_id] = event

                  except Exception as e:
                      print(f"Skipped {sport_name} {day}: {e}")

          items = []

          for event in sorted(
              events.values(),
              key=lambda x: x.get("date", "")
          ):
              event_id = str(event.get("id", ""))
              sport = event.get("_sport", "Sports")

              name = event.get("name", "Sports Event")

              status = (
                  event.get("status", {})
                  .get("type", {})
                  .get("description", "Scheduled")
              )

              competitors = []

              for comp in event.get("competitions", []):
                  for team in comp.get("competitors", []):
                      team_name = (
                          team.get("team", {}).get("displayName")
                          or team.get("team", {}).get("shortDisplayName")
                          or team.get("team", {}).get("name")
                      )

                      if team_name:
                          home_away = team.get("homeAway", "")
                          competitors.append(
                              f"{team_name} ({home_away})"
                          )

                  venue = (
                      comp.get("venue", {})
                      .get("fullName", "")
                  )

                  break

              teams = " vs ".join(competitors)

              if teams:
                  title = f"{sport}: {teams}"
              else:
                  title = f"{sport}: {name}"

              description_parts = [
                  f"Sport: {sport}",
                  f"Event: {name}",
                  f"Status: {status}"
              ]

              if venue:
                  description_parts.append(f"Venue: {venue}")

              description = " | ".join(description_parts)

              date = event.get("date", "")

              items.append(f"""
              <item>
                <title>{escape(title)}</title>
                <description>{escape(description)}</description>
                <pubDate>{escape(date)}</pubDate>
                <guid isPermaLink="false">{escape(event_id)}</guid>
              </item>""")

          now = datetime.now(timezone.utc).strftime(
              "%a, %d %b %Y %H:%M:%S GMT"
          )

          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
            <channel>
              <title>Live &amp; Upcoming Sports</title>
              <description>Live and upcoming sports events</description>
              <link>https://flkracker03-tech.github.io/Sports-rss/</link>
              <lastBuildDate>{now}</lastBuildDate>
              {''.join(items)}
            </channel>
          </rss>
          """

          with open("sports.xml", "w", encoding="utf-8") as f:
              f.write(rss)

          print(f"Total unique events: {len(events)}")
          PY

      - name: Commit RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports.xml
          git diff --cached --quiet || git commit -m "Update sports RSS"
          git push
