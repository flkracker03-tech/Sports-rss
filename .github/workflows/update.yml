
name: Update Sports RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sports RSS
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from html import escape

          sports = [
              ("NFL", "football", "nfl"),
              ("College Football", "football", "college-football"),
              ("NBA", "basketball", "nba"),
              ("WNBA", "basketball", "wnba"),
              ("MLB", "baseball", "mlb"),
              ("NHL", "hockey", "nhl"),
              ("CFL", "football", "cfl")
          ]

          events = []

          for league, sport, league_id in sports:
              url = (
                  "https://site.api.espn.com/apis/site/v2/sports/"
                  f"{sport}/{league_id}/scoreboard"
              )

              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      data = json.load(response)

                  for event in data.get("events", []):
                      competition = event.get("competitions", [{}])[0]
                      competitors = competition.get("competitors", [])

                      names = []

                      for team in competitors:
                          name = team.get("team", {}).get(
                              "displayName", "TBD"
                          )
                          names.append(name)

                      matchup = " vs ".join(names) if names else "TBD"

                      event_date = event.get("date", "")
                      status = (
                          event.get("status", {})
                          .get("type", {})
                          .get("detail", "")
                      )

                      title = f"{league} — {matchup}"

                      if status:
                          title += f" — {status}"

                      events.append({
                          "date": event_date,
                          "title": title
                      })

              except Exception as error:
                  print(f"{league}: {error}")

          events.sort(key=lambda x: x["date"])

          rss = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<rss version="2.0">',
              '<channel>',
              '<title>Sports Events</title>',
              '<description>Live and upcoming sports events only</description>',
              '<link>https://flkracker03-tech.github.io/sports-rss/</link>'
          ]

          for event in events:
              title = escape(event["title"])

              try:
                  dt = datetime.fromisoformat(
                      event["date"].replace("Z", "+00:00")
                  )
                  pub_date = dt.strftime(
                      "%a, %d %b %Y %H:%M:%S +0000"
                  )
              except Exception:
                  pub_date = datetime.now(
                      timezone.utc
                  ).strftime("%a, %d %b %Y %H:%M:%S +0000")

              rss.append(
                  f"<item>"
                  f"<title>{title}</title>"
                  f"<description>{title}</description>"
                  f"<pubDate>{pub_date}</pubDate>"
                  f"</item>"
              )

          rss.extend([
              "</channel>",
              "</rss>"
          ])

          with open("sports.xml", "w", encoding="utf-8") as file:
              file.write("\n".join(rss))

          print(f"Generated {len(events)} sports events")
          PY

      - name: Commit RSS feed
        run: |
          git config user.name "sports-rss-bot"
          git config user.email "actions@github.com"
          git add sports.xml
          git diff --cached --quiet || git commit -m "Update sports RSS"
          git push
